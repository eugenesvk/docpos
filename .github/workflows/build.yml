name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs the workflow at 00:00 on the first day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description	: 'Log level'
        required   	: true
        default    	: 'warning'
        type       	: choice
        options    	:
        - info
        - warning
        - debug

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 26-07
        with:
          persist-credentials: false
      - name: Check
        run: cargo check --workspace --all-targets --all-features
